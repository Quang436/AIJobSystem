<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tìm Việc Theo Bản Đồ - GeoJob</title>
  <link rel="stylesheet" href="../css/globals.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
</head>

<body>
  <div class="tm-kim-vic-lm-qua-bn">
    <header class="top-nav-bar">
      <div class="container">
        <div class="nav-left">
          <a href="user-dashboard.html" class="text">GeoJob</a>
        </div>
        <nav class="nav-center">
          <a class="nav-link" href="user-dashboard.html">Dashboard</a>
          <a class="nav-link active" href="map-jobs.html" aria-current="page">Bản Đồ</a>
        </nav>
        <div class="nav-right" style="display: flex; align-items: center; gap: 16px;">
          <!-- Hiển thị công tắc nếu là Gig Worker -->
          <div id="gigWorkerToggleLayer" style="display: none; align-items: center; gap: 8px;">
            <span style="font-size: 13px; font-weight: 600; color: #475569;" id="workerStatusText">Sẵn sàng nhận
              việc</span>
            <label class="switch" title="Bật để chia sẻ vị trí của bạn với khách hàng">
              <input type="checkbox" id="readyToWorkSwitch">
              <span class="switch-slider"></span>
            </label>
          </div>
          <button class="button" type="button" onclick="handleLogout()"
            style="padding: 8px 16px; background: transparent; border: 1px solid var(--primary, #4F46E5); color: var(--primary, #4F46E5); border-radius: 8px; cursor: pointer; font-weight: 600; font-family: 'Inter', sans-serif;">
            <div class="text-4">Đăng Xuất</div>
          </button>
        </div>
      </div>
    </header>

    <main class="map-jobs-container">
      <div class="map-sidebar">
        <div class="search-section">
          <h2 class="search-title">Tìm Việc Theo Vị Trí</h2>
          <form class="map-search-form" onsubmit="handleMapSearch(event)">
            <div class="search-group">
              <label class="search-label">Chức danh / Kỹ năng</label>
              <input type="text" class="search-input" id="jobTitle" placeholder="Nhập chức danh, kỹ năng..." />
            </div>
            <div class="search-group">
              <label class="search-label">Bán kính</label>
              <select class="search-input" id="radius">
                <option value="">Tất cả</option>
                <option value="5">5 km</option>
                <option value="10">10 km</option>
                <option value="25">25 km</option>
                <option value="50">50 km</option>
              </select>
            </div>
            <button type="submit" class="search-btn">Tìm Kiếm</button>
            <button type="button" class="search-btn" style="background:#6b7280;margin-top:8px;"
              onclick="loadAllJobs()">Xem Tất Cả</button>
          </form>
        </div>

        <div class="results-section">
          <div class="results-header">
            <h3 class="results-title">Kết Quả</h3>
            <span class="results-count" id="resultsCount">Đang tải...</span>
          </div>
          <div class="job-list" id="jobList"></div>
        </div>
      </div>

      <div class="map-main">
        <div id="leafletMap" style="width:100%;height:100%;"></div>
      </div>
    </main>
  </div>

  <style>
    .map-jobs-container {
      display: flex;
      height: calc(100vh - 73px);
      background: #f8f9ff
    }

    .map-sidebar {
      width: 400px;
      background: #fff;
      border-right: 1px solid #e2e8f0;
      overflow-y: auto;
      flex-shrink: 0
    }

    .search-section {
      padding: 24px;
      border-bottom: 1px solid #e2e8f0
    }

    /* Worker Status Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .switch-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #cbd5e1;
      transition: .4s;
      border-radius: 24px;
    }

    .switch-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked+.switch-slider {
      background-color: #10b981;
    }

    input:checked+.switch-slider:before {
      transform: translateX(20px);
    }

    .search-title {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a2e;
      margin: 0 0 20px
    }

    .map-search-form {
      display: flex;
      flex-direction: column;
      gap: 16px
    }

    .search-group {
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .search-label {
      font-size: 14px;
      font-weight: 500;
      color: #374151
    }

    .search-input {
      padding: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: all .2s
    }

    .search-input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 2px rgba(102, 126, 234, .1)
    }

    .search-btn {
      padding: 14px 20px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all .2s
    }

    .search-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, .3)
    }

    .results-section {
      padding: 24px
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px
    }

    .results-title {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a2e;
      margin: 0
    }

    .results-count {
      font-size: 14px;
      color: #6b7280
    }

    .job-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: calc(100vh - 400px);
      overflow-y: auto
    }

    .job-item-map {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 16px;
      background: #f9fafb;
      border-radius: 8px;
      cursor: pointer;
      transition: all .2s
    }

    .job-item-map:hover {
      background: #eef2ff
    }

    .job-item-map.active {
      background: #eef2ff;
      border-left: 3px solid #4F46E5
    }

    .job-marker {
      font-size: 20px;
      flex-shrink: 0
    }

    .job-info {
      flex: 1
    }

    .job-title-map {
      font-size: 14px;
      font-weight: 600;
      color: #1a1a2e;
      margin: 0 0 4px
    }

    .company-name-map {
      font-size: 12px;
      color: #6b7280;
      margin: 0 0 4px
    }

    .job-location-map {
      font-size: 12px;
      color: #6b7280;
      margin: 0 0 4px
    }

    .job-salary-map {
      font-size: 14px;
      font-weight: 600;
      color: #10b981;
      margin: 0 0 8px
    }

    .map-main {
      flex: 1;
      position: relative
    }

    @media(max-width:768px) {
      .map-jobs-container {
        flex-direction: column
      }

      .map-sidebar {
        width: 100%;
        height: 50vh
      }

      .map-main {
        height: 50vh
      }
    }
  </style>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="../js/api.js"></script>
  <script src="../js/worker-tracking.js"></script>
  <script>
    let map = null;
    let markers = [];
    let userLat = null;
    let userLng = null;

    document.addEventListener('DOMContentLoaded', async function () {
      if (!TokenService.isLoggedIn()) {
        window.location.href = 'login.html';
        return;
      }

      try {
        const profile = await ApiService.getProfile();
        if (profile && profile.id) {
          // Xử lý logic Thợ tự do & Lao động Phổ thông
          const workerTypes = ['skilled', 'Thợ tự do', 'Worker', 'Lao động', 'Part-time', 'Phổ thông'];
          if (profile.is_freelancer || (profile.job_seeker_type && workerTypes.some(kw => profile.job_seeker_type.includes(kw)))) {
            document.getElementById('gigWorkerToggleLayer').style.display = 'flex';

            const toggleSwitch = document.getElementById("readyToWorkSwitch");
            const workerId = profile.id;

            if (profile.ready_to_work) {
              toggleSwitch.checked = true;
              document.getElementById('workerStatusText').style.color = '#10b981';
              window.WorkerTracker.startTracking(workerId);
            }

            toggleSwitch.addEventListener("change", async function (e) {
              const statusText = document.getElementById('workerStatusText');
              if (e.target.checked) {
                statusText.style.color = '#10b981';
                window.WorkerTracker.startTracking(workerId);
                UIHelpers.showToast('Bạn đang online! Vị trí đã được chia sẻ.', 'success');
                await ApiService.updateProfile({ ready_to_work: true });
              } else {
                statusText.style.color = '#475569';
                window.WorkerTracker.stopTracking();
                UIHelpers.showToast('Đã dừng nhận việc. Đã tắt GPS.', 'warning');
                await ApiService.updateProfile({ ready_to_work: false });
              }
            });

            document.addEventListener('workerTrackingPermissionDenied', () => {
              toggleSwitch.checked = false;
              document.getElementById('workerStatusText').style.color = '#475569';
              UIHelpers.showToast("Cảnh báo: Bạn đã vô hiệu hóa GPS trong trình duyệt, hệ thống không thể quét việc!", 'error');
            });
          }
        }
      } catch (e) {
        console.warn("Failed to load profile for worker check", e);
      }

      initLeafletMap();
      loadAllJobs();
    });

    function initLeafletMap() {
      map = L.map('leafletMap', { zoomControl: true, attributionControl: false }).setView([16.0544, 108.2022], 12);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 20 }).addTo(map);

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          userLat = pos.coords.latitude;
          userLng = pos.coords.longitude;
          map.flyTo([userLat, userLng], 13, { duration: 1.5 });
          const icon = L.divIcon({
            className: '',
            html: '<div style="background:#ef4444;width:18px;height:18px;border-radius:50%;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,.3);"></div>',
            iconSize: [18, 18], iconAnchor: [9, 9]
          });
          L.marker([userLat, userLng], { icon, zIndexOffset: 1000 }).addTo(map).bindPopup('<b>Vị trí của bạn</b>');
        });
      }
    }

    function clearMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];
    }

    function addJobMarkers(jobs) {
      clearMarkers();
      const icon = L.divIcon({
        className: '',
        html: '<div style="background:#4F46E5;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,.2);color:white;font-size:14px;">💼</div>',
        iconSize: [32, 32], iconAnchor: [16, 16], popupAnchor: [0, -18]
      });

      const bounds = [];
      jobs.forEach(job => {
        const lat = job.gps_lat || job.lat;
        const lng = job.gps_lng || job.lng;
        if (!lat || !lng) return;
        bounds.push([lat, lng]);
        const m = L.marker([lat, lng], { icon }).addTo(map);
        m.bindPopup(`
      <div style="font-family:Inter,sans-serif;min-width:180px;">
        <h4 style="margin:0 0 4px;font-size:14px;">${job.title}</h4>
        <p style="margin:0 0 4px;font-size:12px;color:#6b7280;">${job.company}</p>
        <p style="margin:0 0 8px;font-size:12px;color:#94a3b8;">📍 ${job.address || ''}</p>
        <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px dashed #e2e8f0;padding-top:8px;">
          <span style="font-weight:600;color:#4F46E5;font-size:13px;">${job.salary || 'Thỏa thuận'}</span>
          <button onclick="applyToJob(${job.id})" style="background:#4F46E5;color:white;border:none;padding:4px 10px;border-radius:100px;font-size:11px;cursor:pointer;">Ứng tuyển</button>
        </div>
      </div>
    `);
        markers.push(m);
      });

      if (bounds.length > 0 && !userLat) {
        map.fitBounds(bounds, { padding: [40, 40] });
      }
    }

    async function loadAllJobs() {
      const listEl = document.getElementById('jobList');
      const countEl = document.getElementById('resultsCount');
      listEl.innerHTML = '<p style="padding:16px;color:#6b7280;text-align:center;">Đang tải...</p>';

      try {
        const jobs = await ApiService.getJobs();
        renderJobList(jobs);
        addJobMarkers(jobs);
      } catch (err) {
        listEl.innerHTML = '<p style="padding:16px;color:#ef4444;text-align:center;">Lỗi tải dữ liệu</p>';
        countEl.textContent = 'Lỗi';
      }
    }

    async function handleMapSearch(e) {
      e.preventDefault();
      const keyword = document.getElementById('jobTitle').value.trim();
      const radius = document.getElementById('radius').value;
      const listEl = document.getElementById('jobList');
      listEl.innerHTML = '<p style="padding:16px;color:#6b7280;text-align:center;">Đang tìm kiếm...</p>';

      try {
        const jobs = await ApiService.searchJobs(keyword, null, userLat, userLng, radius || null);
        renderJobList(jobs);
        addJobMarkers(jobs);
      } catch (err) {
        listEl.innerHTML = '<p style="padding:16px;color:#ef4444;">Lỗi tìm kiếm</p>';
      }
    }

    function renderJobList(jobs) {
      const listEl = document.getElementById('jobList');
      const countEl = document.getElementById('resultsCount');
      countEl.textContent = `${jobs.length} công việc`;

      if (jobs.length === 0) {
        listEl.innerHTML = '<p style="padding:24px;text-align:center;color:#6b7280;">Không tìm thấy công việc</p>';
        return;
      }

      listEl.innerHTML = jobs.map((job, i) => `
    <div class="job-item-map" onclick="focusJob(${job.gps_lat || 0}, ${job.gps_lng || 0}, ${i})" data-idx="${i}">
      <div class="job-marker">📍</div>
      <div class="job-info">
        <h4 class="job-title-map">${job.title}</h4>
        <p class="company-name-map">${job.company}</p>
        <p class="job-location-map">${job.distance_km ? job.distance_km + ' km • ' : ''}${job.address || ''}</p>
        <p class="job-salary-map">${job.salary || 'Thỏa thuận'}</p>
        <button class="apply-btn" onclick="event.stopPropagation(); applyToJob(${job.id})" style="padding:6px 12px;background:#667eea;color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;">Ứng Tuyển</button>
      </div>
    </div>
  `).join('');
    }

    function focusJob(lat, lng, idx) {
      if (lat && lng) map.flyTo([lat, lng], 16, { duration: 1 });
      document.querySelectorAll('.job-item-map').forEach(el => el.classList.remove('active'));
      const el = document.querySelector(`.job-item-map[data-idx="${idx}"]`);
      if (el) el.classList.add('active');
      if (markers[idx]) markers[idx].openPopup();
    }

    async function applyToJob(jobId) {
      try {
        const result = await ApiService.applyJob(jobId);
        UIHelpers.showToast(result.message === 'Apply success' ? 'Ứng tuyển thành công! 🎉' : result.message, result.message === 'Apply success' ? 'success' : 'warning');
      } catch (err) {
        UIHelpers.showToast('Lỗi khi ứng tuyển', 'error');
      }
    }

    function handleLogout() {
      if (confirm('Bạn có chắc muốn đăng xuất?')) {
        TokenService.removeToken();
        localStorage.clear();
        window.location.href = 'login.html';
      }
    }
  </script>
</body>

</html>
