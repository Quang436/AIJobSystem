<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoJob - Tìm Việc Theo Vị Trí</title>
  <meta name="description"
    content="GeoJob - Nền tảng kết nối việc làm thông minh dựa trên vị trí. Tìm việc làm gần bạn nhất với công nghệ AI." />
  <link rel="stylesheet" href="../css/globals.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    .urgent-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      align-items: center;
      justify-content: center;
    }

    .urgent-content {
      background: white;
      width: min(500px, 95vw);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #374151;
      font-size: 14px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      font-size: 15px;
      transition: all 0.2s;
    }

    .form-group input:focus {
      border-color: #ef4444;
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
      outline: none;
    }

    .suggestion-item:hover {
      background: #f9fafb;
    }
  </style>
</head>

<body>
  <div class="tm-kim-vic-lm-qua-bn">
    <header class="top-nav-bar">
      <div class="container">
        <div class="nav-left">
          <a href="#" class="text" id="navLogo">GeoJob</a>
        </div>
        <form class="search-bar" style="display:none;" onsubmit="handleSearch(event)">
          <input class="search-input" type="search" placeholder="Tìm kiếm công việc..." />
        </form>
        <nav class="nav-center">
          <a class="nav-link active" href="index.html">Tìm Việc</a>
          <a class="nav-link" href="map-jobs.html">Bản Đồ</a>
        </nav>
        <div class="nav-right" id="navRight">
          <!-- Sẽ được render bởi JS -->
        </div>
      </div>
    </header>

    <section class="hero-section">
      <div class="container">
        <h1 class="hero-title">Tìm Việc Làm Phù Hợp<br><span>Dựa Trên Vị Trí Của Bạn</span></h1>
        <p class="hero-subtitle">Hệ thống AI gợi ý việc làm thông minh, kết nối nhà tuyển dụng và ứng viên trong bán kính gần nhất.</p>

        <div style="display: flex; gap: 16px; justify-content: center; margin-bottom: 32px;">
          <button class="button" onclick="openUrgentModal()" style="padding: 14px 28px; background: #ef4444; border: none; font-size: 16px; font-weight: 700; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); border-radius: 12px; cursor: pointer; color: white;">🆘 Cần Thợ Gấp (Không cần Đăng ký)</button>
        </div>

        <div class="search-box">
          <form class="dual-search-bar" id="heroForm">
            <div class="search-inputs">
              <div class="search-input-group">
                <input class="keyword-input" type="text" name="keywords" placeholder="Chức danh, kỹ năng hoặc công ty"
                  aria-label="Chức danh, từ khóa hoặc công ty" />
              </div>
              <div class="search-input-group">
                <input class="location-input" type="text" name="location" placeholder="Thành phố, quận hoặc địa chỉ"
                  aria-label="Thành phố, quận hoặc địa chỉ" />
                <button class="current-location-btn" type="button" aria-label="Sử dụng vị trí hiện tại">
                  📍
                </button>
              </div>
            </div>
            <button class="search-submit-btn" id="heroSearchBtn" type="button">
              Tìm Việc
            </button>
          </form>
          <div class="popular-searches">
            <span class="popular-label">Phổ biến:</span>
            <div class="popular-tags">
              <button class="popular-tag" type="button">Hà Nội</button>
              <button class="popular-tag" type="button">Hồ Chí Minh</button>
              <button class="popular-tag" type="button">IT</button>
              <button class="popular-tag" type="button">Phần mềm</button>
              <button class="popular-tag" type="button">Kế toán</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <main class="main-content-area">
      <aside class="left-sidebar">
        <div class="filter-section">
          <div class="filter-header">
            <h1 class="text-5">Việc Làm Mới Nhất</h1>
            <p class="text-6" id="jobCount">Đang tải...</p>
          </div>
        </div>
        <div class="job-list" id="jobListContainer"></div>
      </aside>
      <section class="map-section">
        <div id="map" class="map-container" style="z-index: 1;"></div>
      </section>
    </main>
  </div>

  <!-- Modal: Cần thợ gấp (Guest) -->
  <div class="urgent-modal" id="urgentModal">
    <div class="urgent-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h2 style="font-size: 24px; font-weight: 800; color: #111827;">🆘 Đặt thợ gấp</h2>
        <button onclick="closeUrgentModal()" style="background: none; border: none; font-size: 28px; cursor: pointer; color: #9ca3af;">&times;</button>
      </div>
      <form id="urgentForm" onsubmit="handleUrgentSubmit(event)">
        <div class="form-group">
          <label>Công việc cần làm *</label>
          <input type="text" name="title" placeholder="VD: Sửa ống nước bị vỡ, Sửa điều hòa..." required />
        </div>
        <div class="form-group">
          <label>Mô tả chi tiết</label>
          <textarea name="description" placeholder="Mô tả tình trạng sự cố..." rows="3"></textarea>
        </div>
        <div class="form-group" style="position: relative;">
          <label>Địa chỉ của bạn *</label>
          <input type="text" id="urgentAddress" name="address" placeholder="Nhập địa chỉ để thợ tìm đến..." autocomplete="off" required />
          <div id="urgentSuggestions" style="display: none; position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #e5e7eb; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); z-index: 50; max-height: 200px; overflow-y: auto; margin-top: 4px;"></div>
          <input type="hidden" id="urgentLat" name="gps_lat" value="16.0544" />
          <input type="hidden" id="urgentLng" name="gps_lng" value="108.2022" />
        </div>
        <div class="form-group">
          <label>Số điện thoại liên hệ *</label>
          <input type="tel" name="phone" placeholder="Để thợ gọi cho bạn" required />
        </div>
        <div class="form-group">
          <label>Chuyên môn yêu cầu (Kỹ năng)</label>
          <input type="text" name="skills" placeholder="VD: Điện nước, Sửa máy tính..." />
        </div>
        <button type="submit" id="urgentSubmitBtn" style="width: 100%; padding: 16px; background: #ef4444; color: white; border: none; border-radius: 14px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 12px; transition: all 0.2s;">Gửi yêu cầu ngay</button>
      </form>
    </div>
  </div>

  <div id="jobDetailModal" style="display:none; position:fixed; inset:0; z-index:9000; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px);" onclick="if(event.target===this)closeJobModal()">
    <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:min(680px,95vw); max-height:90vh; overflow-y:auto; background:#fff; border-radius:20px; padding:32px;">
      <div id="jobDetailContent"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/api.js"></script>
  <script>
    let currentMap = null;
    let userLat = null;
    let userLng = null;

    function renderNav() {
      const navRight = document.getElementById('navRight');
      const userRole = localStorage.getItem('userRole');
      if (TokenService.isLoggedIn()) {
        let dashboardUrl = 'user-dashboard.html';
        if (userRole === 'employer') dashboardUrl = 'employer-dashboard.html';
        if (userRole === 'admin') dashboardUrl = 'admin-dashboard.html';
        navRight.innerHTML = `
          <a href="${dashboardUrl}" class="nav-link" style="font-weight:600; color:var(--primary);">Dashboard</a>
          <button class="button" onclick="handleLogout()" style="padding:8px 16px; background:transparent; border:1px solid var(--primary); color:var(--primary); border-radius:8px; cursor:pointer;">Đăng Xuất</button>`;
      } else {
        navRight.innerHTML = `
          <a href="login.html" class="button" style="padding:8px 16px; background:transparent; border:1px solid var(--primary); color:var(--primary); text-decoration:none; border-radius:8px;">Đăng Nhập</a>
          <a href="register.html" class="button" style="padding:8px 16px; background:var(--primary); color:white; text-decoration:none; border-radius:8px;">Đăng Ký</a>`;
      }
    }

    function handleLogout() {
      localStorage.clear(); TokenService.removeToken(); window.location.href = 'index.html';
    }

    // ==========================================
    // Urgent Guest Booking
    // ==========================================
    function openUrgentModal() { document.getElementById('urgentModal').style.display = 'flex'; }
    function closeUrgentModal() { document.getElementById('urgentModal').style.display = 'none'; }

    const urgentAddrInput = document.getElementById('urgentAddress');
    const urgentSuggest = document.getElementById('urgentSuggestions');
    let dbTimer;

    urgentAddrInput.addEventListener('input', function() {
      clearTimeout(dbTimer);
      const q = this.value.trim();
      if (q.length < 3) { urgentSuggest.style.display = 'none'; return; }
      dbTimer = setTimeout(async () => {
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=vn&limit=5`);
          const data = await res.json();
          if (data && data.length > 0) {
            urgentSuggest.innerHTML = data.map(i => `<div style="padding:12px; cursor:pointer; border-bottom:1px solid #f3f4f6; font-size:13px;" onclick="selectUrgentAddr('${i.display_name.replace(/'/g, "\\'")}', ${i.lat}, ${i.lon})">📍 ${i.display_name}</div>`).join('');
            urgentSuggest.style.display = 'block';
          } else urgentSuggest.style.display = 'none';
        } catch(e) {}
      }, 500);
    });

    function selectUrgentAddr(name, lat, lon) {
      urgentAddrInput.value = name;
      document.getElementById('urgentLat').value = lat;
      document.getElementById('urgentLng').value = lon;
      urgentSuggest.style.display = 'none';
    }

    async function handleUrgentSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('urgentSubmitBtn');
      btn.disabled = true; btn.innerText = 'Đang gửi...';
      const fd = new FormData(e.target);
      const data = {
        title: fd.get('title'), description: fd.get('description'),
        address: fd.get('address'), phone: fd.get('phone'),
        gps_lat: parseFloat(fd.get('gps_lat')), gps_lng: parseFloat(fd.get('gps_lng')),
        skills: fd.get('skills')
      };
      try {
        await ApiService.createUrgentGuestJob(data);
        alert('Yêu cầu đã được gửi! Các thợ ở gần sẽ liên hệ với bạn qua SĐT ngay.');
        closeUrgentModal();
        e.target.reset();
      } catch (err) { alert('Lỗi: ' + (err.data?.message || 'Không thể gửi yêu cầu')); }
      finally { btn.disabled = false; btn.innerText = 'Gửi yêu cầu ngay'; }
    }

    // ==========================================
    // Jobs & Map
    // ==========================================
    async function loadJobs(kw = null, loc = null) {
      const container = document.getElementById('jobListContainer');
      const countEl = document.getElementById('jobCount');
      UIHelpers.showLoading(container);
      try {
        const jobs = (kw || loc) ? await ApiService.searchJobs(kw, loc, userLat, userLng) : await ApiService.getJobs();
        countEl.textContent = `${jobs.length} công việc`;
        if (jobs.length === 0) { container.innerHTML = '<p style="text-align:center; padding:40px;">Không tìm thấy công việc</p>'; return; }
        container.innerHTML = jobs.map(j => UIHelpers.renderJobCard(j, TokenService.isLoggedIn())).join('');
      } catch (e) { container.innerHTML = '<p>Lỗi tải dữ liệu</p>'; }
    }

    function initMap() {
      currentMap = L.map('map', { zoomControl: false, attributionControl: false }).setView([16.0544, 108.2022], 13);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(currentMap);
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(p => {
          userLat = p.coords.latitude; userLng = p.coords.longitude;
          currentMap.flyTo([userLat, userLng], 14);
          L.marker([userLat, userLng]).addTo(currentMap).bindPopup('Vị trí của bạn');
        });
      }
    }

    async function handleSearch(e) {
      if (e) e.preventDefault();
      const k = document.querySelector('.keyword-input').value;
      const l = document.querySelector('.location-input').value;
      await loadJobs(k, l);
    }

    function closeJobModal() { document.getElementById('jobDetailModal').style.display = 'none'; document.body.style.overflow = ''; }

    document.addEventListener('DOMContentLoaded', () => { renderNav(); loadJobs(); initMap(); });
  </script>
</body>
</html>
