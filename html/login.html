<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Đăng Nhập - GeoJob</title>
<link rel="stylesheet" href="../css/globals.css" />
<link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
<nav class="auth-nav">
<div class="auth-nav-container">
<a href="index.html" class="auth-logo">GeoJob</a>
<div class="auth-nav-links">
<a href="index.html" class="auth-nav-link">Trang Chủ</a>
<a href="login.html" class="auth-nav-link active">Đăng Nhập</a>
<a href="register.html" class="auth-nav-link">Đăng Ký</a>
</div>
</div>
</nav>

<div class="auth-container">
<div class="auth-bg-pattern"></div>
<div class="auth-bg-shapes">
<div class="auth-shape"></div>
<div class="auth-shape"></div>
<div class="auth-shape"></div>
</div>

<div class="auth-card-wrapper">
<div class="auth-card">
<div class="auth-header">
<h1 class="auth-title">Đăng Nhập</h1>
<p class="auth-subtitle">Chào mừng trở lại! Đăng nhập để tiếp tục tìm kiếm công việc</p>
</div>

<div id="loginError" class="auth-error" style="display: none;"></div>

<form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
<div class="form-group">
<label class="form-label" for="email">Email</label>
<div class="form-input-wrapper">
<input class="form-input" type="email" id="email" name="email" placeholder="Nhập email của bạn" required aria-required="true" />
</div>
</div>

<div class="form-group">
<label class="form-label" for="password">Mật khẩu</label>
<div class="form-input-wrapper">
<input class="form-input" type="password" id="password" name="password" placeholder="Nhập mật khẩu" required aria-required="true" />
</div>
</div>

<div class="form-options">
<div class="remember-me">
<input type="checkbox" id="remember" name="remember" />
<label for="remember">Ghi nhớ đăng nhập</label>
</div>
<a href="#" class="forgot-password">Quên mật khẩu?</a>
</div>

<button class="auth-submit-btn" type="submit" id="loginBtn">
Đăng Nhập
</button>
</form>

<div class="social-login">
<div class="social-divider">
<span>Hoặc đăng nhập với</span>
</div>
<div class="social-buttons">
<button class="social-btn google" type="button">
<span>Google</span>
</button>
<button class="social-btn github" type="button">
<span>GitHub</span>
</button>
</div>
</div>

<div class="auth-footer">
<p class="auth-footer-text">Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
</div>
</div>
</div>
</div>

<script src="../js/api.js"></script>
<script>
async function handleLogin(event) {
  event.preventDefault();
  
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const loginBtn = document.getElementById('loginBtn');
  const errorDiv = document.getElementById('loginError');
  
  // Basic validation
  if (!email || !password) {
    showError('Vui lòng nhập email và mật khẩu');
    return;
  }
  
  // Disable button, show loading
  loginBtn.disabled = true;
  loginBtn.textContent = 'Đang đăng nhập...';
  errorDiv.style.display = 'none';
  
  try {
    const data = await ApiService.login(email, password);
    
    if (data && data.access_token) {
      // Login thành công - lấy profile để biết role
      const profile = await ApiService.getProfile();
      
      if (profile && profile.id) {
        const normalizedRole = (profile.role || 'user').toLowerCase();
        localStorage.setItem('userEmail', profile.email);
        localStorage.setItem('userName', profile.fullname || email.split('@')[0]);
        localStorage.setItem('userRole', normalizedRole);
        localStorage.setItem('userId', profile.id);
        
        UIHelpers.showToast('Đăng nhập thành công!', 'success');
        
        // Redirect theo role
        setTimeout(() => {
          const userRole = (profile.role || '').toLowerCase();
          if (userRole === 'admin') {
            localStorage.setItem('isAdmin', 'true');
            localStorage.setItem('adminEmail', profile.email);
            window.location.href = 'admin-dashboard.html';
          } else if (userRole === 'employer') {
            window.location.href = 'employer-dashboard.html';
          } else {
            window.location.href = 'user-dashboard.html';
          }
        }, 800);
      }
    } else {
      // Login sai thông tin
      showError(data?.message || 'Email hoặc mật khẩu không đúng');
    }
  } catch (err) {
    console.error('Login error:', err);
    if (err.data && err.data.detail) {
      showError(err.data.detail);
    } else if (err.data && err.data.message) {
      showError(err.data.message);
    } else {
      showError('Không thể kết nối đến server. Vui lòng kiểm tra backend đang chạy.');
    }
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = 'Đăng Nhập';
  }
}

function showError(message) {
  const errorDiv = document.getElementById('loginError');
  errorDiv.textContent = message;
  errorDiv.style.display = 'block';
  errorDiv.style.color = '#ef4444';
  errorDiv.style.background = '#fef2f2';
  errorDiv.style.padding = '12px 16px';
  errorDiv.style.borderRadius = '8px';
  errorDiv.style.marginBottom = '16px';
  errorDiv.style.fontSize = '14px';
  errorDiv.style.textAlign = 'center';
  errorDiv.style.border = '1px solid #fecaca';
}

// Nếu đã đăng nhập, redirect
document.addEventListener('DOMContentLoaded', function() {
  if (TokenService.isLoggedIn()) {
    const role = localStorage.getItem('userRole');
    if (role === 'admin') {
      window.location.href = 'admin-dashboard.html';
    } else {
      window.location.href = 'user-dashboard.html';
    }
  }

  // Form validation UX
  const form = document.querySelector('.auth-form');
  const inputs = form.querySelectorAll('.form-input');
  
  inputs.forEach(input => {
    input.addEventListener('input', function() {
      if (this.value.trim()) {
        this.classList.remove('error');
      }
    });
    
    input.addEventListener('blur', function() {
      if (!this.value.trim()) {
        this.classList.add('error');
      }
    });
  });
});
</script>

</body>
</html>
