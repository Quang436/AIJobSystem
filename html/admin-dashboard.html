<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Dashboard - GeoJob</title>
<link rel="stylesheet" href="../css/globals.css" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="tm-kim-vic-lm-qua-bn">
<header class="top-nav-bar">
<div class="container">
<div class="nav-left">
<a href="admin-dashboard.html" class="text">GeoJob Admin</a>
</div>
<nav class="nav-center">
<a class="nav-link active" href="admin-dashboard.html">Dashboard</a>
</nav>
<div class="nav-right">
<button class="button" type="button" onclick="handleLogout()">
<div class="text-4">Đăng Xuất</div>
</button>
</div>
</div>
</header>

<main class="admin-container">
<div class="admin-sidebar">
<div class="admin-user-info">
<div class="admin-avatar">A</div>
<div class="admin-details">
<h3 class="admin-name" id="adminName">Admin</h3>
<p class="admin-email" id="adminEmail">admin@geojob.com</p>
</div>
</div>
<div class="admin-menu">
<a class="admin-menu-item active" href="admin-dashboard.html">
<span class="menu-icon">📊</span><span class="menu-text">Dashboard</span>
</a>
</div>
</div>

<div class="admin-content">
<div class="admin-header">
<h1 class="admin-title">Dashboard Quản Trị</h1>
<p class="admin-subtitle">Tổng quan hệ thống GeoJob</p>
</div>

<div class="stats-grid" id="statsGrid">
<div class="stat-card"><div class="stat-icon">👥</div><div class="stat-info"><h3 class="stat-number" id="statUsers">--</h3><p class="stat-label">Người Dùng</p></div></div>
<div class="stat-card"><div class="stat-icon">💼</div><div class="stat-info"><h3 class="stat-number" id="statJobs">--</h3><p class="stat-label">Công Việc</p></div></div>
<div class="stat-card"><div class="stat-icon">📝</div><div class="stat-info"><h3 class="stat-number" id="statApps">--</h3><p class="stat-label">Đơn Ứng Tuyển</p></div></div>
<div class="stat-card"><div class="stat-icon">✅</div><div class="stat-info"><h3 class="stat-number" id="statActive">--</h3><p class="stat-label">Việc Đang Tuyển</p></div></div>
</div>

<div class="admin-section">
<h2 class="section-title">Ứng Tuyển Gần Đây</h2>
<div class="activity-list" id="recentApps"><p style="color:#6b7280;padding:16px;">Đang tải...</p></div>
</div>

<div class="admin-section">
<h2 class="section-title">Người Dùng Mới</h2>
<div class="activity-list" id="recentUsers"><p style="color:#6b7280;padding:16px;">Đang tải...</p></div>
</div>
</div>
</main>
</div>

<style>
.admin-container{display:flex;min-height:calc(100vh - 73px);background:#f8f9ff}
.admin-sidebar{width:280px;background:#fff;border-right:1px solid #e2e8f0;padding:24px;flex-shrink:0}
.admin-user-info{display:flex;align-items:center;gap:16px;padding-bottom:24px;border-bottom:1px solid #e2e8f0;margin-bottom:24px}
.admin-avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:700}
.admin-details h3{font-size:16px;font-weight:600;color:#1a1a2e;margin:0 0 4px}
.admin-details p{font-size:14px;color:#6b7280;margin:0}
.admin-menu{display:flex;flex-direction:column;gap:8px}
.admin-menu-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:8px;text-decoration:none;color:#6b7280;transition:all .2s}
.admin-menu-item:hover{background:#f3f4f6;color:#1a1a2e}
.admin-menu-item.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.menu-icon{font-size:20px}.menu-text{font-size:14px;font-weight:500}
.admin-content{flex:1;padding:32px;overflow-y:auto}
.admin-header{margin-bottom:32px}
.admin-title{font-size:28px;font-weight:700;color:#1a1a2e;margin:0 0 8px}
.admin-subtitle{font-size:16px;color:#6b7280;margin:0}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:32px}
.stat-card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.05);display:flex;align-items:center;gap:16px}
.stat-icon{font-size:32px}
.stat-number{font-size:24px;font-weight:700;color:#1a1a2e;margin:0 0 4px}
.stat-label{font-size:14px;color:#6b7280;margin:0}
.admin-section{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:24px}
.section-title{font-size:20px;font-weight:600;color:#1a1a2e;margin:0 0 20px}
.activity-list{display:flex;flex-direction:column;gap:12px}
.activity-item{display:flex;align-items:center;gap:16px;padding:16px;border-radius:8px;background:#f9fafb}
.activity-icon{font-size:24px}
.activity-text{font-size:14px;color:#374151;margin:0 0 4px}
.activity-time{font-size:12px;color:#9ca3af;margin:0}
@media(max-width:768px){.admin-container{flex-direction:column}.admin-sidebar{width:100%;padding:16px}.admin-content{padding:16px}}
</style>

<script src="../js/api.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function() {
  if (!TokenService.isLoggedIn()) {
    window.location.href = 'login.html';
    return;
  }

  const role = localStorage.getItem('userRole');
  if (role !== 'admin') {
    UIHelpers.showToast('Bạn không có quyền truy cập', 'error');
    window.location.href = 'user-dashboard.html';
    return;
  }

  document.getElementById('adminEmail').textContent = localStorage.getItem('userEmail') || '';
  document.getElementById('adminName').textContent = localStorage.getItem('userName') || 'Admin';

  try {
    const stats = await ApiService.getAdminStats();
    document.getElementById('statUsers').textContent = stats.total_users || 0;
    document.getElementById('statJobs').textContent = stats.total_jobs || 0;
    document.getElementById('statApps').textContent = stats.total_applications || 0;
    document.getElementById('statActive').textContent = stats.active_jobs || 0;

    const appsContainer = document.getElementById('recentApps');
    if (stats.recent_applications && stats.recent_applications.length > 0) {
      appsContainer.innerHTML = stats.recent_applications.map(a => `
        <div class="activity-item">
          <div class="activity-icon">📝</div>
          <div class="activity-content">
            <p class="activity-text"><strong>${a.user_name}</strong> ứng tuyển <strong>${a.job_title}</strong></p>
            <p class="activity-time">${a.status} • ${new Date(a.applied_at).toLocaleDateString('vi-VN')}</p>
          </div>
        </div>
      `).join('');
    } else {
      appsContainer.innerHTML = '<p style="color:#6b7280;padding:8px;">Chưa có đơn ứng tuyển</p>';
    }

    const usersContainer = document.getElementById('recentUsers');
    if (stats.recent_users && stats.recent_users.length > 0) {
      usersContainer.innerHTML = stats.recent_users.map(u => `
        <div class="activity-item">
          <div class="activity-icon">👤</div>
          <div class="activity-content">
            <p class="activity-text"><strong>${u.fullname}</strong> - ${u.email}</p>
            <p class="activity-time">${u.role} • ${new Date(u.created_at).toLocaleDateString('vi-VN')}</p>
          </div>
        </div>
      `).join('');
    } else {
      usersContainer.innerHTML = '<p style="color:#6b7280;padding:8px;">Chưa có người dùng</p>';
    }
  } catch (err) {
    console.error('Admin stats error:', err);
    UIHelpers.showToast('Lỗi tải thống kê', 'error');
  }
});

function handleLogout() {
  if (confirm('Bạn có chắc muốn đăng xuất?')) {
    TokenService.removeToken();
    localStorage.clear();
    window.location.href = 'login.html';
  }
}
</script>
</body>
</html>
