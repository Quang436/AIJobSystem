<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quản Lý Người Dùng - GeoJob Admin</title>
<link rel="stylesheet" href="../css/globals.css" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="tm-kim-vic-lm-qua-bn">
<header class="top-nav-bar">
<div class="container">
<div class="nav-left">
<a href="admin-dashboard.html" class="text">GeoJob Admin</a>
</div>
<nav class="nav-center">
<a class="nav-link" href="admin-dashboard.html">Dashboard</a>
<a class="nav-link active" href="admin-users.html">Người Dùng</a>
</nav>
<div class="nav-right">
<button class="button" onclick="handleLogout()">Đăng Xuất</button>
</div>
</div>
</header>

<main class="admin-container">
<div class="admin-sidebar">
<div class="admin-menu">
<a class="admin-menu-item" href="admin-dashboard.html">📊 Dashboard</a>
<a class="admin-menu-item active" href="admin-users.html">👥 Người Dùng</a>
</div>
</div>

<div class="admin-content">
<div class="admin-header">
<h1 class="admin-title">Quản Lý Người Dùng</h1>
<p class="admin-subtitle">Danh sách tài khoản trên hệ thống</p>
</div>

<div class="admin-section">
<table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
<thead>
<tr style="background: #f3f4f6; text-align: left;">
<th style="padding: 12px; border-bottom: 2px solid #e2e8f0;">ID</th>
<th style="padding: 12px; border-bottom: 2px solid #e2e8f0;">Họ Tên</th>
<th style="padding: 12px; border-bottom: 2px solid #e2e8f0;">Email</th>
<th style="padding: 12px; border-bottom: 2px solid #e2e8f0;">Vai Trò</th>
<th style="padding: 12px; border-bottom: 2px solid #e2e8f0;">Ngày Tạo</th>
</tr>
</thead>
<tbody id="userTableBody">
<!-- Data will be loaded here -->
</tbody>
</table>
</div>
</div>
</main>
</div>

<script src="../js/api.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function() {
    if (localStorage.getItem('userRole') !== 'admin') { window.location.href = 'login.html'; return; }
    
    try {
        const users = await ApiService._request('/users');
        const tbody = document.getElementById('userTableBody');
        tbody.innerHTML = users.map(u => `
            <tr>
                <td style="padding: 12px; border-bottom: 1px solid #eee;">${u.id}</td>
                <td style="padding: 12px; border-bottom: 1px solid #eee;">${u.fullname}</td>
                <td style="padding: 12px; border-bottom: 1px solid #eee;">${u.email}</td>
                <td style="padding: 12px; border-bottom: 1px solid #eee;"><span style="padding: 4px 8px; background: #eef2ff; color: #4f46e5; border-radius: 4px; font-size: 12px;">${u.role}</span></td>
                <td style="padding: 12px; border-bottom: 1px solid #eee;">${new Date(u.created_at).toLocaleDateString('vi-VN')}</td>
            </tr>
        `).join('');
    } catch (err) {
        UIHelpers.showToast('Lỗi tải danh sách người dùng', 'error');
    }
});

function handleLogout() {
    TokenService.removeToken();
    localStorage.clear();
    window.location.href = 'login.html';
}
</script>
</body>
</html>
