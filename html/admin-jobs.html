<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quản Lý Công Việc - GeoJob Admin</title>
<link rel="stylesheet" href="../css/globals.css" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="tm-kim-vic-lm-qua-bn">
<header class="top-nav-bar">
<div class="container">
<div class="nav-left">
<a href="admin-dashboard.html" class="text">GeoJob Admin</a>
</div>
<nav class="nav-center">
<a class="nav-link" href="admin-dashboard.html">Dashboard</a>
<a class="nav-link active" href="admin-jobs.html">Công Việc</a>
</nav>
<div class="nav-right">
<button class="button" onclick="handleLogout()">Đăng Xuất</button>
</div>
</div>
</header>

<main class="admin-container">
<div class="admin-sidebar">
<div class="admin-menu">
<a class="admin-menu-item" href="admin-dashboard.html">📊 Dashboard</a>
<a class="admin-menu-item active" href="admin-jobs.html">💼 Công Việc</a>
</div>
</div>

<div class="admin-content">
<div class="admin-header">
<h1 class="admin-title">Quản Lý Công Việc</h1>
<p class="admin-subtitle">Danh sách các tin tuyển dụng trên hệ thống</p>
</div>

<div class="admin-section">
<table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
<thead>
<tr style="background: #f3f4f6; text-align: left;">
<th style="padding: 12px; border-bottom: 2px solid #e2e8f0;">ID</th>
<th style="padding: 12px; border-bottom: 2px solid #e2e8f0;">Tiêu đề</th>
<th style="padding: 12px; border-bottom: 2px solid #e2e8f0;">Công ty</th>
<th style="padding: 12px; border-bottom: 2px solid #e2e8f0;">Lương</th>
<th style="padding: 12px; border-bottom: 2px solid #e2e8f0;">Thao tác</th>
</tr>
</thead>
<tbody id="jobTableBody">
<!-- Data will be loaded here -->
</tbody>
</table>
</div>
</div>
</main>
</div>

<script src="../js/api.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function() {
    if (localStorage.getItem('userRole') !== 'admin') { window.location.href = 'login.html'; return; }
    loadJobs();
});

async function loadJobs() {
    try {
        const jobs = await ApiService.getJobs();
        const tbody = document.getElementById('jobTableBody');
        tbody.innerHTML = jobs.map(j => `
            <tr>
                <td style="padding: 12px; border-bottom: 1px solid #eee;">${j.id}</td>
                <td style="padding: 12px; border-bottom: 1px solid #eee;"><strong>${j.title}</strong></td>
                <td style="padding: 12px; border-bottom: 1px solid #eee;">${j.company}</td>
                <td style="padding: 12px; border-bottom: 1px solid #eee; color: #10b981; font-weight: 600;">${j.salary}</td>
                <td style="padding: 12px; border-bottom: 1px solid #eee;">
                    <button onclick="deleteJob(${j.id})" style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Xóa</button>
                </td>
            </tr>
        `).join('');
    } catch (err) {
        UIHelpers.showToast('Lỗi tải danh sách công việc', 'error');
    }
}

async function deleteJob(id) {
    if (confirm('Bạn có chắc chắn muốn xóa công việc này?')) {
        try {
            await ApiService.deleteJob(id);
            UIHelpers.showToast('Đã xóa thành công', 'success');
            loadJobs();
        } catch (err) {
            UIHelpers.showToast('Lỗi khi xóa', 'error');
        }
    }
}

function handleLogout() {
    TokenService.removeToken();
    localStorage.clear();
    window.location.href = 'login.html';
}
</script>
</body>
</html>
